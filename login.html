<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirjaudu</title>
  <style>
    :root { --bg:#0c0c0d; --elev:#141416; --fg:#f3f3f1; --muted:#8a8a86; --line:#2a2a2c; --accent:#c8c8c3; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:ui-sans-serif,system-ui,sans-serif; }
    main { min-height:100vh; display:grid; place-items:center; padding:24px; }
    form { width:min(360px,100%); background:var(--elev); border:1px solid var(--line); border-radius:12px; padding:22px; }
    h1 { margin:0 0 8px; font-size:1.15rem; font-weight:560; }
    p { margin:0 0 16px; color:var(--muted); font-size:.9rem; }
    label { display:block; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
    input { width:100%; height:40px; border-radius:8px; border:1px solid var(--line); background:#0c0c0d; color:var(--fg); padding:0 12px; font-size:1rem; }
    button { margin-top:14px; width:100%; height:40px; border:0; border-radius:8px; background:var(--accent); color:#111; font-weight:650; cursor:pointer; }
    .err { color:#e24b4b; margin:0 0 12px; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <form method="post" action="/api/login">
      <h1>Yksityinen sivu</h1>
      <p>Syötä salasana. Selain muistaa kirjautumisen.</p>
      <p class="err" id="err" hidden>Väärä salasana.</p>
      <label for="password">Salasana</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <input type="hidden" name="next" id="next" value="/">
      <button type="submit">Kirjaudu</button>
    </form>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get("error")) document.getElementById("err").hidden = false;
    const n = q.get("next");
    if (n && n.startsWith("/") && !n.startsWith("//")) document.getElementById("next").value = n;
  </script>
</body>
</html>
