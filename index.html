<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily Digest</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('dd-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html[data-theme="light"] {
    --bg: #f6f3ee;
    --bg-elev: #fffdf9;
    --ink: #1c1917;
    --muted: #78716c;
    --line: #e7e0d5;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --danger: #b91c1c;
    --shadow: 0 1px 2px rgba(28, 25, 23, 0.04), 0 12px 32px rgba(28, 25, 23, 0.06);
    --radius: 18px;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0c0a09;
    --bg-elev: #1c1917;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --line: #292524;
    --accent: #5eead4;
    --accent-soft: #134e4a;
    --danger: #fca5a5;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.35);
    --radius: 18px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 1.05rem;
    line-height: 1.55;
  }
  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 20;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    box-shadow: var(--shadow);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .theme-toggle:hover { opacity: 0.85; }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-toggle svg {
    width: 1.15rem;
    height: 1.15rem;
    display: block;
  }
  html[data-theme="light"] .icon-moon { display: none; }
  html[data-theme="dark"] .icon-sun { display: none; }
  .shell {
    width: min(44rem, calc(100% - 2rem));
    margin: 0 auto;
    padding: 2.5rem 0 4rem;
  }
  header.hero { margin-bottom: 1.75rem; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
    background: currentColor;
  }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 4vw, 2.65rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0.85rem 0 0.55rem;
  }
  .lede {
    margin: 0;
    color: var(--muted);
    max-width: 36rem;
    font-size: 1.02rem;
  }
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(1.25rem, 3vw, 1.85rem);
  }
  #err:empty { display: none; }
  #err {
    margin-bottom: 1rem;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    color: var(--danger);
    font-size: 0.95rem;
  }
  #content h1 { display: none; }
  #content .run-meta {
    margin-top: 2rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.78rem;
    opacity: 0.85;
    font-weight: normal;
  }
  #content details.section {
    margin: 1.35rem 0 0;
    border-bottom: 1px solid var(--line);
    padding-bottom: 0.55rem;
  }
  #content details.section:first-of-type { margin-top: 0.35rem; }
  #content details.section > summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.55rem;
    font-family: Fraunces, Georgia, serif;
    font-size: 1.22rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    padding: 0.35rem 0 0.55rem;
    user-select: none;
  }
  #content details.section > summary::-webkit-details-marker { display: none; }
  #content details.section > summary::before {
    content: "";
    width: 0.45rem;
    height: 0.45rem;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg);
    transition: transform 0.15s ease;
    flex: 0 0 auto;
    margin-top: -0.1rem;
  }
  #content details.section[open] > summary::before {
    transform: rotate(45deg);
    margin-top: 0.05rem;
  }
  #content details.section > summary:hover { opacity: 0.85; }
  #content details.section .section-body { padding: 0.15rem 0 0.35rem 1rem; }
  #content p { margin: 0.45rem 0; }
  #content ol {
    margin: 0.4rem 0 0.9rem;
    padding-left: 1.2rem;
  }
  #content li {
    margin: 0.55rem 0;
    padding-left: 0.2rem;
  }
  #content li::marker {
    color: var(--accent);
    font-weight: 600;
  }
  #content strong { font-weight: 600; }
  a,
  #content a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover,
  #content a:hover { opacity: 0.75; }
  a.link-mark,
  #content a.link-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.35rem;
    height: 1.35rem;
    margin-left: 0.2rem;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    font-size: 0.78rem;
    line-height: 1;
    vertical-align: -0.1em;
  }
  #content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    padding: 0.1em 0.35em;
    border-radius: 6px;
    background: color-mix(in srgb, var(--line) 70%, transparent);
  }
  footer.note {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer.note a { color: var(--muted); }
</style>
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Vaihda tumma tai vaalea teema" title="Tumma / vaalea">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
    </svg>
  </button>
  <div class="shell">
    <header class="hero">
      <span class="eyebrow">Morning brief</span>
      <h1>Daily Digest</h1>
      <p class="lede">Posti, kalenteri, X, YouTube ja seurattavat sivut — yksi tiivis aamuraportti.</p>
    </header>
    <div id="err"></div>
    <main class="panel">
      <article id="content">Ladataan…</article>
    </main>
    <footer class="note">Lähde: <code>digest.md</code> · repo <a class="link-mark" href="https://github.com/jukka12/daily-digest" title="jukka12/daily-digest" aria-label="jukka12/daily-digest">↗</a></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function current() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('dd-theme', theme); } catch (e) {}
        btn.setAttribute('aria-label', theme === 'dark' ? 'Vaihda vaaleaan teemaan' : 'Vaihda tummaan teemaan');
      }
      btn.addEventListener('click', function () {
        setTheme(current() === 'dark' ? 'light' : 'dark');
      });
      setTheme(current());
    })();

    function stylizeLinks(root) {
      root.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href') || '';
        const label = (a.textContent || href).trim();
        a.textContent = '↗';
        a.classList.add('link-mark');
        a.title = label;
        a.setAttribute('aria-label', label);
        if (/^https?:/i.test(href)) a.setAttribute('rel', 'noopener noreferrer');
      });
    }
    function translateStatus(s) {
      if (!s) return "valmis";
      var lower = String(s).trim().toLowerCase();
      if (lower === "ready" || lower === "valmis") return "valmis";
      return String(s).trim();
    }

    function translateWindow(w) {
      if (!w) return "";
      return String(w)
        .replace(/mail last 24\s*h/gi, "posti viimeiset 24 h")
        .replace(/\bcalendar\b/gi, "kalenteri")
        .replace(/Radar since/gi, "Radar alkaen");
    }

    function parseRunMeta(text) {
      var lines = String(text).split(/\r?\n/);
      var meta = { status: null, updated: null, window: null };
      var body = [];
      var keyRe = /^(status|updated|window|tila|päivitetty|ikkuna)\s*:\s*(.*)$/i;
      for (var i = 0; i < lines.length; i++) {
        var raw = lines[i];
        var trimmed = raw.trim();
        if (
          trimmed &&
          /tila\s*:/i.test(trimmed) &&
          /päivitetty/i.test(trimmed) &&
          trimmed.indexOf("\u00b7") !== -1
        ) {
          var tilaM = trimmed.match(/tila\s*:\s*([^·]+)/i);
          var paivM = trimmed.match(/päivitetty\s*:?\s*([^·]+)/i);
          var ikkM = trimmed.match(/ikkuna\s*:\s*(.+)$/i);
          if (tilaM) meta.status = tilaM[1].trim();
          if (paivM) meta.updated = paivM[1].trim();
          if (ikkM) meta.window = ikkM[1].trim();
          continue;
        }
        var m = trimmed.match(keyRe);
        if (m) {
          var key = m[1].toLowerCase();
          var val = (m[2] || "").trim();
          if (key === "status" || key === "tila") meta.status = val;
          else if (key === "updated" || key === "päivitetty") meta.updated = val;
          else if (key === "window" || key === "ikkuna") meta.window = val;
          continue;
        }
        body.push(raw);
      }
      var bodyText = body.join("\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "").replace(/\n+$/, "\n");
      return { body: bodyText, meta: meta };
    }

    function buildFinnishFooter(meta) {
      if (!meta || (!meta.status && !meta.updated && !meta.window)) return null;
      var parts = ["tila: " + translateStatus(meta.status || "ready")];
      if (meta.updated) parts.push("päivitetty " + String(meta.updated).trim());
      if (meta.window) parts.push("ikkuna: " + translateWindow(meta.window));
      return parts.join(" · ");
    }

    function makeSectionsCollapsible(root) {
      var nodes = Array.from(root.childNodes);
      var frag = document.createDocumentFragment();
      var i = 0;
      while (i < nodes.length) {
        var node = nodes[i];
        if (node.nodeType === 1 && node.tagName === "H2") {
          var details = document.createElement("details");
          details.className = "section";
          details.open = true;
          var summary = document.createElement("summary");
          summary.textContent = (node.textContent || "").trim();
          details.appendChild(summary);
          var body = document.createElement("div");
          body.className = "section-body";
          i += 1;
          while (i < nodes.length) {
            var n = nodes[i];
            if (n.nodeType === 1 && n.tagName === "H2") break;
            if (n.nodeType === 1 && n.classList && n.classList.contains("run-meta")) break;
            body.appendChild(n);
            i += 1;
          }
          details.appendChild(body);
          frag.appendChild(details);
          continue;
        }
        frag.appendChild(node);
        i += 1;
      }
      root.innerHTML = "";
      root.appendChild(frag);
    }


    fetch('digest.md', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
      .then(t => {
        const parsed = parseRunMeta(t);
        const el = document.getElementById('content');
        el.innerHTML = marked.parse(parsed.body);
        makeSectionsCollapsible(el);
        const footer = buildFinnishFooter(parsed.meta);
        if (footer) {
          const p = document.createElement('p');
          p.className = 'run-meta';
          p.textContent = footer;
          el.appendChild(p);
        }
        stylizeLinks(el);
      })
      .catch(e => {
        document.getElementById('err').textContent = 'digest.md ei latautunut: ' + e.message;
        document.getElementById('content').textContent = '';
      });
  </script>
</body>
</html>
