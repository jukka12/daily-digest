<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily Digest</title>
<script>
(function(){try{var s=localStorage.getItem("dd-theme");var t=s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var st=localStorage.getItem("dd-style")||"chat";var sty=st==="admin"?"admin":"chat";document.documentElement.setAttribute("data-style",sty);document.documentElement.classList.toggle("dd-admin",sty==="admin");document.documentElement.classList.toggle("dd-chat",sty==="chat");}catch(e){document.documentElement.setAttribute("data-theme","light");document.documentElement.setAttribute("data-style","chat");document.documentElement.classList.add("dd-chat");document.documentElement.classList.remove("dd-admin");}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

html[data-theme="light"] {
  --rail: #1a1d21;
  --sidebar: #19171d;
  --sidebar-hover: #27242d;
  --sidebar-text: #c9c3d4;
  --sidebar-muted: #78748a;
  --msg-bg: #ffffff;
  --msg-hover: #f4f5f7;
  --ink: #1d1c1d;
  --muted: #616061;
  --border: #e8e8e8;
  --accent: #6c5ce7;
  --accent-soft: #eeebfb;
  --online: #2bac76;
  --danger: #e01e5a;
  --shadow: 0 1px 0 rgba(0,0,0,.06);
}
html[data-theme="dark"] {
  --rail: #121316;
  --sidebar: #0e0d10;
  --sidebar-hover: #1c1a22;
  --sidebar-text: #c9c3d4;
  --sidebar-muted: #78748a;
  --msg-bg: #1a1820;
  --msg-hover: #221f2a;
  --ink: #f3f2f5;
  --muted: #9b97a8;
  --border: #2c2933;
  --accent: #8b7cf6;
  --accent-soft: #2a2440;
  --online: #2bac76;
  --danger: #f0719a;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--msg-bg);
  display: flex;
  min-height: 100vh;
}
.app { display: flex; width: 100%; min-height: 100vh; }
.rail {
  width: 56px; flex: 0 0 56px;
  background: var(--rail);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 10px; z-index: 3;
}
.rail-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 12px; letter-spacing: -0.02em;
}
.rail .spacer { margin-top: auto; }
.style-foot {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px 16px 16px;
  border-top: 1px solid var(--border);
  background: transparent;
}
.style-toggle {
  border: 1px solid var(--border);
  background: var(--msg-bg);
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.style-toggle:hover { opacity: .9; }

.site-links {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px 14px;
  justify-content: center;
  align-items: center;
  margin: 0;
  width: auto;
  white-space: nowrap;
}
.site-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.site-links a:hover { color: var(--ink); opacity: 1; }
.site-links a[aria-current="page"] {
  color: var(--ink);
  pointer-events: none;
}
html[data-style="admin"] .site-links a { color: var(--admin-muted, var(--muted)); }
html[data-style="admin"] .site-links a:hover,
html[data-style="admin"] .site-links a[aria-current="page"] {
  color: var(--admin-ink);
}
.style-foot {
  flex-direction: row;
  flex-wrap: nowrap;
  justify-content: center;
  align-items: center;
  gap: 14px;
}

html[data-style="admin"] .style-foot {
  border-top-color: var(--admin-border);
}
html[data-style="admin"] .style-toggle {
  border-color: var(--admin-border);
  background: var(--admin-card);
  color: var(--admin-ink);
}
.theme-toggle.xd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  flex-shrink: 0;
}
.theme-toggle.xd:hover { opacity: 0.8; }
.theme-toggle.xd svg { width: 20px; height: 20px; display: block; }
.theme-toggle.xd .icon-sun { display: none; }
.theme-toggle.xd .icon-moon { display: block; }
html[data-theme="light"] .theme-toggle.xd .icon-moon { display: none; }
html[data-theme="light"] .theme-toggle.xd .icon-sun { display: block; }
html[data-theme="dark"] .theme-toggle.xd .icon-sun { display: none; }
html[data-theme="dark"] .theme-toggle.xd .icon-moon { display: block; }
.sidebar {
  width: 220px; flex: 0 0 220px;
  background: var(--sidebar); color: var(--sidebar-text);
  display: flex; flex-direction: column; padding: 14px 10px;
  border-right: 1px solid rgba(255,255,255,.04);
}
.sidebar h1 {
  margin: 2px 8px 14px; font-size: 15px; font-weight: 700; color: #fff;
}
.sidebar .lede {
  margin: 0 8px 16px; font-size: 12px; color: var(--sidebar-muted); line-height: 1.4;
}
.nav-label {
  margin: 8px 8px 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--sidebar-muted);
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; border: 0;
  background: transparent; color: var(--sidebar-text);
  font: inherit; font-weight: 500; cursor: pointer; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--sidebar-hover); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item .hash { opacity: .7; font-weight: 600; }

.sidebar {
  position: relative;
  overflow: hidden;
  min-width: 64px;
  max-width: 360px;
}
.sidebar-resizer {
  position: absolute;
  top: 0; right: 0;
  width: 8px; height: 100%;
  cursor: col-resize;
  z-index: 5;
  background: transparent;
}
.sidebar-resizer:hover,
.sidebar-resizer.dragging {
  background: color-mix(in srgb, var(--accent) 45%, transparent);
}
.sidebar-collapse-btn {
  position: absolute;
  top: 12px;
  right: 8px;
  z-index: 6;
  width: 28px;
  height: 28px;
  border: 1px solid color-mix(in srgb, var(--sidebar-text) 25%, transparent);
  border-radius: 8px;
  background: color-mix(in srgb, var(--sidebar) 80%, #000);
  color: var(--sidebar-text);
  cursor: pointer;
  display: grid;
  place-items: center;
  padding: 0;
  line-height: 1;
  font-size: 14px;
}
.sidebar-collapse-btn:hover { opacity: 0.9; background: var(--sidebar-hover); }
.sidebar.collapsed .sidebar-collapse-btn {
  right: 50%;
  transform: translateX(50%);
}
html[data-style="admin"] .sidebar-collapse-btn { display: none !important; }
.sidebar { padding-top: 44px; }
.sidebar.collapsed { padding-top: 48px; }

.nav-item .nav-ico {
  width: 22px; height: 22px; flex: 0 0 22px;
  border-radius: 6px; overflow: hidden;
  display: grid; place-items: center;
}
.nav-item .nav-ico svg { width: 22px; height: 22px; display: block; }
.nav-item .nav-label-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar.collapsed {
  width: 72px !important;
  flex-basis: 72px !important;
  padding-left: 8px;
  padding-right: 8px;
}
.sidebar.collapsed h1,
.sidebar.collapsed .lede,
.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-label-text,
.sidebar.collapsed .hash {
  display: none !important;
}
.sidebar.collapsed .nav-item {
  justify-content: center;
  padding: 10px 8px;
}
html[data-style="chat"] .sidebar {
  transition: none;
}

.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  background: var(--msg-bg);
}
.status-foot {
  display: none !important;
  flex: 0 0 auto;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  color: var(--sidebar-muted);
  font-size: 11px;
  line-height: 1.45;
  opacity: 0.75;
  letter-spacing: 0.01em;
}
.status-foot #footChannel { font-weight: 500; margin-right: 0.35rem; }
.status-foot #footMeta { font-weight: 400; }
.thread {
  flex: 1; overflow: auto; padding: 12px 0 40px;
}
#err:empty { display: none; }
#err {
  margin: 12px 18px; padding: 10px 12px; border-radius: 8px;
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  color: var(--danger); font-size: 14px;
}
#content { max-width: 52rem; margin: 0 auto; padding: 0 18px; }
#content > h1 { display: none; }
.message {
  display: grid; grid-template-columns: 40px 1fr; gap: 10px;
  padding: 8px 10px; border-radius: 8px; margin: 2px 0;
}
.message:hover { background: var(--msg-hover); }
.section-block { margin: 18px 0 28px; }
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 8px; padding: 4px 6px;
  border-radius: 8px;
  color: inherit;
  text-decoration: none !important;
}
a.section-head { color: inherit; cursor: pointer; }
a.section-head:hover { background: var(--msg-hover); text-decoration: none !important; opacity: 1; }
.section-head h2 {
  margin: 0; font-size: 16px; font-weight: 700; color: var(--ink);
}
.app-icon {
  width: 28px; height: 28px; flex: 0 0 28px;
  border-radius: 7px; overflow: hidden;
  display: grid; place-items: center;
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.app-icon svg { width: 28px; height: 28px; display: block; }
.item-list { display: flex; flex-direction: column; gap: 2px; }
.item-row {
  display: block;
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none !important;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  touch-action: pan-y;
  transition: transform .2s ease, opacity .2s ease, max-height .25s ease, padding .2s ease, margin .2s ease, border .2s ease;
  will-change: transform;
}
.item-row.swiping { transition: none; }
.item-row.dismissing {
  opacity: 0;
  max-height: 0 !important;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
  margin: 0 !important;
  border-width: 0 !important;
  overflow: hidden;
  pointer-events: none;
}
a.item-row { color: var(--ink); cursor: pointer; font-size: inherit; font-weight: inherit; }
a.item-row:hover, .item-row:hover { background: var(--msg-hover); text-decoration: none !important; }
.item-row .sub {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 16px;
  font-weight: 600;
}
.mail-folder-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.1em;
  height: 1.1em;
  margin-left: 0.45em;
  vertical-align: -0.15em;
  opacity: 0.85;
}
.mail-folder-ico svg { width: 1.05em; height: 1.05em; display: block; }
.item-row strong,
.item-row b {
  font-weight: 600;
  font-size: inherit;
}
a, #content a { color: var(--accent); text-decoration: none; }
a:hover { opacity: .9; }
a.item-row, #content a.item-row,
.item-row a, #content .item-row a {
  color: inherit !important;
  font: inherit;
  text-decoration: none !important;
}
a.item-row:hover, #content a.item-row:hover { opacity: 1; }
#content code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em; padding: 0.08em 0.3em; border-radius: 4px;
  background: color-mix(in srgb, var(--border) 80%, transparent);
}
.run-meta { display: none; }
@media (max-width: 820px) {
  .rail { display: none; }
  .sidebar { width: 160px; flex-basis: 160px; }
}
@media (max-width: 640px) {
  .sidebar { display: none; }
}


/* —— Style switch (top right) —— */
.topbar {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  padding: 10px 16px 0; flex: 0 0 auto;
}
.kpi-strip { display: none; }

/* —— Admin Dashboard UI (alternate; chat layout preserved) —— */
html[data-style="admin"] {
  --admin-bg: #f1f5f9;
  --admin-card: #ffffff;
  --admin-ink: #0f172a;
  --admin-muted: #64748b;
  --admin-border: #e2e8f0;
  --admin-indigo: #4f46e5;
  --admin-violet: #7c3aed;
  --admin-teal: #0d9488;
  --admin-amber: #f59e0b;
  --admin-rose: #e11d48;
}
html[data-style="admin"][data-theme="dark"] {
  --admin-bg: #000000;
  --admin-card: #0a0a0a;
  --admin-ink: #f8fafc;
  --admin-muted: #a1a1aa;
  --admin-border: #27272a;
}
html[data-style="admin"] body {
  background: var(--admin-bg);
  color: var(--admin-ink);
}
html[data-style="admin"] .app { background: var(--admin-bg); }
html[data-style="admin"] .rail {
  background: #000000;
}
html[data-theme="light"][data-style="admin"] .rail {
  background: linear-gradient(180deg, #312e81 0%, #1e1b4b 100%);
}
html[data-style="admin"] .rail-mark {
  background: linear-gradient(135deg, #818cf8, #c084fc);
}
html[data-style="admin"] .sidebar,
html.dd-admin nav.sidebar {
  display: none !important;
}
html[data-style="admin"] .sidebar h1 { color: var(--admin-ink); }
html[data-style="admin"] .sidebar .lede,
html[data-style="admin"] .nav-label { color: var(--admin-muted); }
html[data-style="admin"] .nav-item {
  color: var(--admin-ink);
  border-radius: 10px;
}
html[data-style="admin"] .nav-item:hover { background: color-mix(in srgb, var(--admin-indigo) 8%, transparent); }
html[data-style="admin"] .nav-item.active {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: #fff;
}
html[data-style="admin"] .main { background: var(--admin-bg); }
html[data-style="admin"] .thread { padding: 8px 0 32px; }
html[data-style="admin"] #content {
  max-width: 72rem;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  padding: 0 18px 18px;
  align-items: start;
}
html[data-style="admin"] .section-block.admin-card {
  margin: 0;
  border-radius: 18px;
  padding: 20px 18px;
  border: 1px solid transparent;
  box-shadow: 0 10px 28px rgba(15, 23, 42, .08);
  color: #0f172a;
  transition: box-shadow .2s ease, transform .15s ease;
  min-height: 112px;
}
html[data-style="admin"] .section-block.admin-card.tone-mail {
  background: #38bdf8;
  border-color: #0ea5e9;
}
html[data-style="admin"] .section-block.admin-card.tone-calendar {
  background: #4ade80;
  border-color: #22c55e;
}
html[data-style="admin"] .section-block.admin-card.tone-x {
  background: #a78bfa;
  border-color: #8b5cf6;
}
html[data-style="admin"] .section-block.admin-card.tone-youtube {
  background: #fb7185;
  border-color: #f43f5e;
}
/* same bright box colors in dark; page bg stays black */
html[data-theme="dark"][data-style="admin"] .section-block.admin-card.tone-mail,
html[data-theme="dark"][data-style="admin"] .section-block.admin-card.tone-calendar,
html[data-theme="dark"][data-style="admin"] .section-block.admin-card.tone-x,
html[data-theme="dark"][data-style="admin"] .section-block.admin-card.tone-youtube {
  color: #0f172a;
}
html[data-style="admin"] .section-block.admin-card.expanded {
  grid-column: 1 / -1;
}
html[data-style="admin"] .section-block.admin-card:not(.expanded) .item-list {
  display: none;
}
html[data-style="admin"] .section-block.admin-card {
  color: #0f172a;
}
html[data-theme="dark"][data-style="admin"] .section-block.admin-card {
  color: #0f172a;
}
html[data-style="admin"] .section-block.admin-card:not(.expanded) .section-head {
  margin: 0;
  padding: 10px 4px;
  border-bottom: 0;
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  min-height: 72px;
}
html[data-style="admin"] .section-block.admin-card:not(.expanded) .section-head h2 {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0);
  white-space: nowrap; border: 0;
}
html[data-style="admin"] .section-block.admin-card .app-icon {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border-radius: 12px;
}
html[data-style="admin"] .section-block.admin-card .app-icon svg {
  width: 48px;
  height: 48px;
}
html[data-style="admin"] .section-block.admin-card .sec-count {
  font-size: 36px;
  font-weight: 750;
  letter-spacing: -0.03em;
  line-height: 1;
  color: inherit;
}
html[data-style="admin"] .section-block.admin-card .sec-unit {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: inherit;
  opacity: 0.95;
  white-space: nowrap;
}
html[data-style="admin"] .section-block.admin-card.expanded .section-head {
  margin: 0 0 10px;
  padding: 2px 2px 12px;
  border-bottom: 1px solid color-mix(in srgb, currentColor 18%, transparent);
  cursor: pointer;
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
html[data-style="admin"] .section-block.admin-card.expanded .section-head h2 {
  position: static;
  width: auto; height: auto;
  margin: 0; clip: auto; overflow: visible;
  font-size: 16px; font-weight: 700;
  color: inherit;
  flex: 1 1 auto;
  order: 2;
}
html[data-style="admin"] .section-block.admin-card.expanded .app-icon { order: 1; }
html[data-style="admin"] .section-block.admin-card.expanded .sec-count,
html[data-style="admin"] .section-block.admin-card.expanded .sec-unit {
  display: none;
}
html[data-style="admin"] .section-block.admin-card .item-list { gap: 0; }
html[data-style="admin"] .section-block.admin-card .item-row {
  padding: 11px 4px;
  border-radius: 0;
  border-bottom: 1px solid color-mix(in srgb, currentColor 14%, transparent);
  color: inherit;
  background: transparent !important;
  font-size: 16px;
  font-weight: 600;
}
html[data-style="admin"] .section-block.admin-card a.item-row {
  font-size: 16px;
  font-weight: 600;
}
html[data-style="admin"] .section-block.admin-card .item-row .sub,
html[data-style="admin"] .section-block.admin-card .item-row strong,
html[data-style="admin"] .section-block.admin-card .item-row b {
  font-size: 16px;
  font-weight: 600;
}
html[data-style="admin"] .section-block.admin-card .item-list .item-row:last-child { border-bottom: 0; }
html[data-style="admin"] .section-block.admin-card .item-row:hover {
  background: transparent !important;
  opacity: 0.92;
}
html[data-style="admin"] .section-block.admin-card .item-row .sub {
  color: inherit;
  opacity: 0.85;
}
html[data-style="admin"] .status-foot {
  border-top: 1px solid var(--admin-border);
  color: var(--admin-muted);
  background: transparent;
}
@media (max-width: 900px) {
  html[data-style="admin"] #content { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  html[data-style="admin"] #content { grid-template-columns: 1fr; }
}

/* Explicit Chat resets — Mac desktop keeps sidebar visible; admin styles must not linger */
html[data-style="chat"] body,
html[data-style="chat"] .app,
html[data-style="chat"] .main {
  background: var(--msg-bg) !important;
  color: var(--ink) !important;
}
html[data-style="chat"] .rail {
  background: var(--rail) !important;
}
html[data-style="chat"] .rail-mark {
  background: var(--accent) !important;
}
/* Chat owns dark Kanavat sidebar (desktop) */
html[data-style="chat"] .sidebar {
  display: flex !important;
  background: var(--sidebar) !important;
  color: var(--sidebar-text) !important;
}
@media (max-width: 640px) {
  html[data-style="chat"] .sidebar { display: none !important; }
}
html[data-style="chat"] #content {
  display: block !important;
  max-width: 52rem !important;
  margin: 0 auto !important;
  padding: 0 18px !important;
  grid-template-columns: none !important;
  gap: 0 !important;
}
html[data-style="chat"] .section-block {
  margin: 18px 0 28px !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  padding: 0 !important;
  min-height: 0 !important;
  color: var(--ink) !important;
}
html[data-style="chat"] .section-head {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  gap: 10px !important;
  margin: 0 0 8px !important;
  padding: 4px 6px !important;
  border-bottom: 0 !important;
  cursor: default !important;
}

(function () {

  var MIN = 64, MAX = 360, COLLAPSE = 96, EXPANDED = 220, NARROW = 72;
  function syncToggle(px) {
    if (!toggle) return;
    var collapsed = px <= COLLAPSE;
    toggle.textContent = collapsed ? "›" : "‹";
    toggle.title = collapsed ? "Laajenna sivupalkki" : "Kutista sivupalkki";
    toggle.setAttribute("aria-label", toggle.title);
  }
  function applyWidth(px) {
    px = Math.max(MIN, Math.min(MAX, px));

    side.style.setProperty("flex-basis", px + "px", "important");
    side.classList.toggle("collapsed", px <= COLLAPSE);
    syncToggle(px);
    try { localStorage.setItem("dd-sidebar-width", String(px)); } catch (e) {}
  }
  window.__ddApplySidebarWidth = applyWidth;
  try {
    var saved = parseInt(localStorage.getItem("dd-sidebar-width") || String(EXPANDED), 10);
    if (!isNaN(saved)) applyWidth(saved);

  if (toggle) {
    toggle.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (document.documentElement.getAttribute("data-style") === "admin") return;
      var w = side.getBoundingClientRect().width;
      if (w <= COLLAPSE) {
        var prev = EXPANDED;
        try {
          var p = parseInt(localStorage.getItem("dd-sidebar-expanded") || String(EXPANDED), 10);
          if (!isNaN(p) && p > COLLAPSE) prev = p;
        } catch (err) {}
        applyWidth(prev);
      } else {
        try { localStorage.setItem("dd-sidebar-expanded", String(Math.round(w))); } catch (err) {}
        applyWidth(NARROW);
      }
    });
  }
  var dragging = false, startX = 0, startW = 0;
  function onDown(e) {
    if (document.documentElement.getAttribute("data-style") === "admin") return;
    dragging = true;
    startX = e.clientX;
    startW = side.getBoundingClientRect().width;
    handle.classList.add("dragging");

  handle.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse") return;
    onMove(e);
  });
  handle.addEventListener("pointerup", onUp);

  var lines = String(text).split(/\r?\n/);
  var meta = { status: null, updated: null, window: null };
  var body = [];
  var keyRe = /^(status|updated|window|tila|paivitetty|ikkuna)\s*:\s*(.*)$/i;
  for (var i = 0; i < lines.length; i++) {

      var paivM = trimmed.match(/p[^:]*:\s*([^·]+)/i);
      if (!paivM) paivM = trimmed.match(/päivitetty\s*:?\s*([^·]+)/i);
      var ikkM = trimmed.match(/ikkuna\s*:\s*(.+)$/i);
      if (tilaM) meta.status = tilaM[1].trim();
      if (paivM) meta.updated = paivM[1].trim();
      if (ikkM) meta.window = ikkM[1].trim();
      continue;
    }
    var m = trimmed.match(keyRe);
    if (m) {
      var key = m[1].toLowerCase();
      var val = (m[2] || "").trim();
      if (key === "status" || key === "tila") meta.status = val;
      else if (key.indexOf("p") === 0 || key === "updated") meta.updated = val;
      else if (key === "window" || key === "ikkuna") meta.window = val;

    if (/^päivitetty\s*:/i.test(trimmed) || /^updated\s*:/i.test(trimmed)) {

      continue;
    }

  }

  if (!folder || !FOLDER_ICONS[folder]) return;
  var span = document.createElement("span");
  span.className = "mail-folder-ico";
  span.title = folder;
  span.setAttribute("aria-label", folder);
  span.innerHTML = FOLDER_ICONS[folder];
  row.appendChild(span);
}

function buildItemRows(container, kind) {
  var list = document.createElement("div");
  list.className = "item-list";
  var items = [];
  container.querySelectorAll("li").forEach(function (li) { items.push(li); });
  var allowLinks = !(kind === "mail" || kind === "calendar");
  if (!items.length) {
    Array.from(container.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && (n.tagName === "P" || n.tagName === "DIV")) {
        var href = allowLinks ? extractHref(n) : null;
        var row = document.createElement(href ? "a" : "div");
        row.className = "item-row";
        if (href) { row.href = href; row.target = "_blank"; row.rel = "noopener noreferrer"; }
        var c = n.cloneNode(true);
        c.querySelectorAll("a[href]").forEach(function (a) {
          var label = (a.textContent || "").trim();
          var h = a.getAttribute("href") || "";
          if (/^https?:\/\//i.test(label) || label === h) a.remove();
          else { var s = document.createElement("span"); s.innerHTML = a.innerHTML; a.replaceWith(s); }
        });
        row.innerHTML = c.innerHTML.replace(/^<p>/i, "").replace(/<\/p>$/i, "");
        if ((row.textContent || "").trim()) {
          if (isRowDismissed(kind, row)) return;
          enableSwipeDismiss(row, kind);
          list.appendChild(row);
        }
      }
    });
    return list;
  }
  items.forEach(function (li) {
    var href = allowLinks ? extractHref(li) : null;
    var row = document.createElement(href ? "a" : "div");
    row.className = "item-row";
    if (href) { row.href = href; row.target = "_blank"; row.rel = "noopener noreferrer"; }
    var clone = li.cloneNode(true);
    clone.querySelectorAll("a[href]").forEach(function (a) {
      var label = (a.textContent || "").trim();
      var h = a.getAttribute("href") || "";
      if (/^https?:\/\//i.test(label) || label === h || label === "↗") a.remove();
      else { var s = document.createElement("span"); s.innerHTML = a.innerHTML; a.replaceWith(s); }
    });
    var chunks = [];
    var buf = document.createElement("div");
    function flush() {
      var t = buf.innerHTML.trim();
      if (t) chunks.push(t);
      buf = document.createElement("div");
    }
    Array.from(clone.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && n.tagName === "BR") { flush(); return; }
      if (n.nodeType === 1 && n.tagName === "P") {
        flush();
        var pt = n.innerHTML.trim();
        if (pt && !/^https?:\/\/\S+$/i.test(n.textContent.trim())) chunks.push(pt);
        return;
      }
      buf.appendChild(n.cloneNode(true));
    });
    flush();
    chunks = chunks.filter(function (c) {
      var tmp = document.createElement("div");
      tmp.innerHTML = c;
      return !/^https?:\/\/\S+$/i.test((tmp.textContent || "").trim());
    });
    if (!chunks.length) return;
    var html = chunks[0];
    for (var i = 1; i < chunks.length; i++) html += '<span class="sub">' + chunks[i] + "</span>";
    if (kind === "mail") {
      var extracted = extractFolder(html);
      html = extracted.cleaned;
      row.innerHTML = html;
      appendFolderIcon(row, extracted.folder);
    } else {
      row.innerHTML = html;
    }
    if (isRowDismissed(kind, row)) return;
    enableSwipeDismiss(row, kind);
    list.appendChild(row);
  });
  return list;
}

function renderChat(root, markdownHtml) {
  var wrap = document.createElement("div");
  wrap.innerHTML = markdownHtml;
  var nodes = Array.from(wrap.childNodes);
  var frag = document.createDocumentFragment();
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  var allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.className = "nav-item active";
  allBtn.innerHTML = "<span class=\"nav-ico\" aria-hidden=\"true\">" +
    "<svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z\"/></svg>" +
    "</span><span class=\"hash\">#</span> <span class=\"nav-label-text\">kaikki</span>";
  allBtn.addEventListener("click", function () {
    document.querySelectorAll(".nav-item").forEach(function (b) { b.classList.remove("active"); });
    allBtn.classList.add("active");
    document.getElementById("footChannel").textContent = "# kaikki";
    document.querySelectorAll(".section-block").forEach(function (s) {
      s.style.display = "";
      s.classList.remove("expanded");
      var h = s.querySelector(".section-head");
      if (h) h.setAttribute("aria-expanded", "false");
    });
  });
  nav.appendChild(allBtn);
  var i = 0;
  var color = 0;
  while (i < nodes.length) {
    var node = nodes[i];
    if (node.nodeType === 1 && node.tagName === "H2") {
      var title = (node.textContent || "").trim().replace(/:$/, "");
      var id = "sec-" + color;
      var kind = sectionKind(title);
      var block = document.createElement("section");
      block.className = "section-block";
      block.id = id;
      block.setAttribute("data-kind", kind);
      var appHref = APP_LINKS[kind] || null;
      var head = document.createElement(appHref ? "a" : "div");
      head.className = "section-head";
      if (appHref) {
        head.href = appHref;
        head.setAttribute("title", kind === "mail" ? "Avaa Gmail" : "Avaa Google Calendar");
        head.target = "_blank";
        head.rel = "noopener noreferrer";
      }
      var icon = document.createElement("span");
      icon.className = "app-icon";
      icon.innerHTML = ICONS[kind] || ICONS.mail;
      if (kind === "calendar") {
        var d = new Date();
        try {
          d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Helsinki" }));
        } catch (e) {}
        icon.innerHTML = icon.innerHTML.replace(/>5</, ">" + d.getDate() + "<");
      }
      var h2 = document.createElement("h2");
      h2.textContent = title;
      head.appendChild(icon);
      head.appendChild(h2);
      block.appendChild(head);
      var bodyWrap = document.createElement("div");
      i += 1;
      while (i < nodes.length) {
        var n = nodes[i];
        if (n.nodeType === 1 && n.tagName === "H2") break;
        bodyWrap.appendChild(n);
        i += 1;
      }
      block.appendChild(buildItemRows(bodyWrap, kind));
      frag.appendChild(block);
      (function (secId, secTitle) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "nav-item";
        var kind = sectionKind(secTitle);
        var ico = ICONS[kind] || ICONS.mail;
        b.innerHTML = "<span class=\"nav-ico\" aria-hidden=\"true\">" + ico + "</span>" +
          "<span class=\"hash\">#</span> <span class=\"nav-label-text\">" + secTitle + "</span>";
        b.addEventListener("click", function () {
          document.querySelectorAll(".nav-item").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          document.getElementById("footChannel").textContent = "# " + secTitle;
          document.querySelectorAll(".section-block").forEach(function (s) {
            s.style.display = s.id === secId ? "" : "none";
            s.classList.remove("expanded");
            if (s.id === secId && document.documentElement.getAttribute("data-style") === "admin") {
              s.classList.add("expanded");
              var h = s.querySelector(".section-head");
              if (h) h.setAttribute("aria-expanded", "true");
            }
          });
          var el = document.getElementById(secId);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        nav.appendChild(b);
      })(id, title);
      color += 1;
      continue;
    }
    i += 1;
  }
  root.innerHTML = "";
  root.appendChild(frag);
}


function refreshAdminKpis() {
  var content = document.getElementById("content");
  if (!content) return;
  var old = content.querySelector(".kpi-strip");
  if (old) old.remove();
  var sections = Array.from(content.querySelectorAll(".section-block"));
  var isAdmin = document.documentElement.getAttribute("data-style") === "admin";
  var units = { mail: "Mails", calendar: "Events", x: "Posts", youtube: "Videos" };
  var openIds = {};
  sections.forEach(function (sec) {
    if (sec.classList.contains("expanded")) openIds[sec.id] = true;
  });
  sections.forEach(function (sec) {
    sec.classList.remove("admin-card", "expanded", "tone-mail", "tone-calendar", "tone-x", "tone-youtube");
    sec.querySelectorAll(".sec-count, .sec-unit").forEach(function (n) { n.remove(); });
    var head = sec.querySelector(".section-head");
    if (head) {
      head.onclick = null;
      head.removeAttribute("role");
      head.removeAttribute("aria-expanded");
    }
  });
  if (!isAdmin) return;
  sections.forEach(function (sec) {
    var kind = sec.getAttribute("data-kind") || "mail";
    var head = sec.querySelector(".section-head");
    if (!head) return;
    var count = sec.querySelectorAll(".item-row:not(.dismissing)").length;
    sec.classList.add("admin-card", "tone-" + kind);
    var countEl = document.createElement("span");
    countEl.className = "sec-count";
    countEl.textContent = String(count);
    head.appendChild(countEl);
    var unitEl = document.createElement("span");
    unitEl.className = "sec-unit";
    unitEl.textContent = units[kind] || "Items";
    head.appendChild(unitEl);
    head.setAttribute("role", "button");
    var keepOpen = !!openIds[sec.id];
    if (keepOpen) {
      sec.classList.add("expanded");
      head.setAttribute("aria-expanded", "true");
    } else {
      head.setAttribute("aria-expanded", "false");
    }
    head.onclick = function () {
      var willOpen = !sec.classList.contains("expanded");
      sections.forEach(function (s) {
        s.classList.remove("expanded");
        var h = s.querySelector(".section-head");
        if (h) h.setAttribute("aria-expanded", "false");
      });
      if (willOpen) {
        sec.classList.add("expanded");
        head.setAttribute("aria-expanded", "true");
        try { sec.scrollIntoView({ behavior: "smooth", block: "nearest" }); } catch (e) {}
      }
    };
  });
}
window.refreshAdminKpis = refreshAdminKpis;

fetch("digest.md", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.text(); })
  .then(function (t) {
    var parsed = parseRunMeta(t);
    var el = document.getElementById("content");
    renderChat(el, marked.parse(parsed.body));
    refreshAdminKpis();
    var footer = buildFinnishFooter(parsed.meta);
    document.getElementById("footMeta").textContent = footer || "valmis";
  })
  .catch(function (e) {
    document.getElementById("err").textContent = "digest.md ei latautunut: " + e.message;
    document.getElementById("footMeta").textContent = "virhe";
  });
</script>
