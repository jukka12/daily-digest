<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily Digest</title>
<script>
(function(){try{var s=localStorage.getItem("dd-theme");var t=s||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

html[data-theme="light"] {
  --rail: #1a1d21;
  --sidebar: #19171d;
  --sidebar-hover: #27242d;
  --sidebar-text: #c9c3d4;
  --sidebar-muted: #78748a;
  --msg-bg: #ffffff;
  --msg-hover: #f4f5f7;
  --ink: #1d1c1d;
  --muted: #616061;
  --border: #e8e8e8;
  --accent: #6c5ce7;
  --accent-soft: #eeebfb;
  --online: #2bac76;
  --danger: #e01e5a;
  --shadow: 0 1px 0 rgba(0,0,0,.06);
}
html[data-theme="dark"] {
  --rail: #121316;
  --sidebar: #0e0d10;
  --sidebar-hover: #1c1a22;
  --sidebar-text: #c9c3d4;
  --sidebar-muted: #78748a;
  --msg-bg: #1a1820;
  --msg-hover: #221f2a;
  --ink: #f3f2f5;
  --muted: #9b97a8;
  --border: #2c2933;
  --accent: #8b7cf6;
  --accent-soft: #2a2440;
  --online: #2bac76;
  --danger: #f0719a;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: Inter, system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink);
  background: var(--msg-bg);
  display: flex;
  min-height: 100vh;
}
.app { display: flex; width: 100%; min-height: 100vh; }
.rail {
  width: 56px; flex: 0 0 56px;
  background: var(--rail);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0; gap: 10px; z-index: 3;
}
.rail-mark {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  font-weight: 700; font-size: 12px; letter-spacing: -0.02em;
}
.theme-toggle {
  margin-top: auto; width: 36px; height: 36px; border-radius: 10px;
  border: 0; background: transparent; color: var(--sidebar-text);
  cursor: pointer; display: grid; place-items: center;
}
.theme-toggle:hover { background: var(--sidebar-hover); }
.theme-toggle svg { width: 18px; height: 18px; }
html[data-theme="light"] .icon-moon { display: none; }
html[data-theme="dark"] .icon-sun { display: none; }
.sidebar {
  width: 220px; flex: 0 0 220px;
  background: var(--sidebar); color: var(--sidebar-text);
  display: flex; flex-direction: column; padding: 14px 10px;
  border-right: 1px solid rgba(255,255,255,.04);
}
.sidebar h1 {
  margin: 2px 8px 14px; font-size: 15px; font-weight: 700; color: #fff;
}
.sidebar .lede {
  margin: 0 8px 16px; font-size: 12px; color: var(--sidebar-muted); line-height: 1.4;
}
.nav-label {
  margin: 8px 8px 6px; font-size: 11px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--sidebar-muted);
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 8px; border: 0;
  background: transparent; color: var(--sidebar-text);
  font: inherit; font-weight: 500; cursor: pointer; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--sidebar-hover); }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-item .hash { opacity: .7; font-weight: 600; }
.main {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  background: var(--msg-bg);
}
.status-foot {
  flex: 0 0 auto;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  color: var(--sidebar-muted);
  font-size: 11px;
  line-height: 1.45;
  opacity: 0.75;
  letter-spacing: 0.01em;
}
.status-foot #footChannel { font-weight: 500; margin-right: 0.35rem; }
.status-foot #footMeta { font-weight: 400; }
.thread {
  flex: 1; overflow: auto; padding: 12px 0 40px;
}
#err:empty { display: none; }
#err {
  margin: 12px 18px; padding: 10px 12px; border-radius: 8px;
  background: color-mix(in srgb, var(--danger) 12%, transparent);
  color: var(--danger); font-size: 14px;
}
#content { max-width: 52rem; margin: 0 auto; padding: 0 18px; }
#content > h1 { display: none; }
.message {
  display: grid; grid-template-columns: 40px 1fr; gap: 10px;
  padding: 8px 10px; border-radius: 8px; margin: 2px 0;
}
.message:hover { background: var(--msg-hover); }
.section-block { margin: 18px 0 28px; }
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 8px; padding: 4px 6px;
}
.section-head h2 {
  margin: 0; font-size: 16px; font-weight: 700; color: var(--ink);
}
.app-icon {
  width: 28px; height: 28px; flex: 0 0 28px;
  border-radius: 7px; overflow: hidden;
  display: grid; place-items: center;
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
}
.app-icon svg { width: 28px; height: 28px; display: block; }
.item-list { display: flex; flex-direction: column; gap: 2px; }
.item-row {
  display: block;
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none !important;
  font-size: 14.5px;
  line-height: 1.45;
}
a.item-row { color: var(--ink); cursor: pointer; }
a.item-row:hover, .item-row:hover { background: var(--msg-hover); text-decoration: none !important; }
.item-row .sub { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; font-weight: 400; }
.item-row strong { font-weight: 600; }
a, #content a { color: var(--accent); text-decoration: none; }
a:hover { opacity: .9; }
#content code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em; padding: 0.08em 0.3em; border-radius: 4px;
  background: color-mix(in srgb, var(--border) 80%, transparent);
}
.run-meta { display: none; }
@media (max-width: 820px) {
  .rail { display: none; }
  .sidebar { width: 160px; flex-basis: 160px; }
}
@media (max-width: 640px) {
  .sidebar { display: none; }
}

</style>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Workspace">
      <div class="rail-mark" title="Daily Digest">DD</div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Vaihda tumma tai vaalea teema" title="Tumma / vaalea">
        <span class="icon-sun">sun</span>
        <span class="icon-moon">moon</span>
      </button>
    </aside>
    <nav class="sidebar" aria-label="Osiot">
      <h1>Daily Digest</h1>
      <p class="lede">Posti, kalenteri, X ja Youtube — yksi aamuraportti.</p>
      <div class="nav-label">Kanavat</div>
      <div id="nav"></div>
    </nav>
    <main class="main">
      <div id="err"></div>
      <div class="thread"><article id="content"></article></div>
      <footer class="status-foot" aria-label="Tila">
        <span id="footChannel"># kaikki</span>
        <span id="footMeta">Ladataan…</span>
      </footer>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function () {
  var btn = document.getElementById('themeToggle');
  function current() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('dd-theme', theme); } catch (e) {}
    btn.setAttribute('aria-label', theme === 'dark' ? 'Vaihda vaaleaan teemaan' : 'Vaihda tummaan teemaan');
  }
  btn.addEventListener('click', function () {
    setTheme(current() === 'dark' ? 'light' : 'dark');
  });
  setTheme(current());
})();

function translateStatus(s) {
  if (!s) return "valmis";
  var lower = String(s).trim().toLowerCase();
  if (lower === "ready" || lower === "valmis") return "valmis";
  return String(s).trim();
}
function translateWindow(w) {
  if (!w) return "";
  return String(w).replace(/mail last 24\s*h/gi, "posti viimeiset 24 h").replace(/calendar/gi, "kalenteri").replace(/Radar since/gi, "Radar alkaen");
}

function parseRunMeta(text) {
  var lines = String(text).split(/\r?\n/);
  var meta = { status: null, updated: null, window: null };
  var body = [];
  var keyRe = /^(status|updated|window|tila|paivitetty|ikkuna)\s*:\s*(.*)$/i;
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];
    var trimmed = raw.trim();
    if (trimmed && /tila\s*:/i.test(trimmed) && /p/.test(trimmed) && trimmed.indexOf("\u00b7") !== -1 && /ikkuna/i.test(trimmed)) {
      var tilaM = trimmed.match(/tila\s*:\s*([^·]+)/i);
      var paivM = trimmed.match(/p[^:]*:\s*([^·]+)/i);
      if (!paivM) paivM = trimmed.match(/päivitetty\s*:?\s*([^·]+)/i);
      var ikkM = trimmed.match(/ikkuna\s*:\s*(.+)$/i);
      if (tilaM) meta.status = tilaM[1].trim();
      if (paivM) meta.updated = paivM[1].trim();
      if (ikkM) meta.window = ikkM[1].trim();
      continue;
    }
    var m = trimmed.match(keyRe);
    if (m) {
      var key = m[1].toLowerCase();
      var val = (m[2] || "").trim();
      if (key === "status" || key === "tila") meta.status = val;
      else if (key.indexOf("p") === 0 || key === "updated") meta.updated = val;
      else if (key === "window" || key === "ikkuna") meta.window = val;
      continue;
    }
    // also match Finnish paivitetty with diacritic via includes
    if (/^päivitetty\s*:/i.test(trimmed) || /^updated\s*:/i.test(trimmed)) {
      meta.updated = trimmed.split(":").slice(1).join(":").trim();
      continue;
    }
    body.push(raw);
  }
  var bodyText = body.join("\n").replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "").replace(/\n+$/, "\n");
  return { body: bodyText, meta: meta };
}
function buildFinnishFooter(meta) {
  if (!meta || (!meta.status && !meta.updated && !meta.window)) return null;
  var parts = ["tila: " + translateStatus(meta.status || "ready")];
  if (meta.updated) parts.push("päivitetty " + String(meta.updated).trim());
  if (meta.window) parts.push("ikkuna: " + translateWindow(meta.window));
  return parts.join(" \u00b7 ");
}
/* Brand-accurate app icons */
var ICONS = {
  mail: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5AC8FA"/><stop offset="100%" stop-color="#007AFF"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#mg)"/><path fill="#fff" d="M18 32c0-3.3 2.7-6 6-6h52c3.3 0 6 2.7 6 6v36c0 3.3-2.7 6-6 6H24c-3.3 0-6-2.7-6-6V32zm8.2 2l23.8 17.2L73.8 34H26.2zm49.8 4.7L52.4 55.2c-1.4 1-3.3 1-4.7 0L24 40.7V66c0 1.1.9 2 2 2h48c1.1 0 2-.9 2-2V38.7z"/></svg>',
  calendar: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#fff"/><path fill="#FF3B30" d="M0 22C0 9.85 9.85 0 22 0h56c12.15 0 22 9.85 22 22v18H0V22z"/><text x="50" y="78" text-anchor="middle" font-family="Inter,Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#1d1d1f">5</text><circle cx="28" cy="12" r="4" fill="#fff" opacity=".95"/><circle cx="72" cy="12" r="4" fill="#fff" opacity=".95"/></svg>',
  x: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#000"/><path fill="#fff" d="M55.7 48.3 78.6 22H73.2L53.3 44.3 37.4 22H21.2l24 34.9L21.2 78h5.4l21.1-24.5L64.4 78h16.2L55.7 48.3zm-7.5 8.7-2.4-3.5L29 26.1h8.3l15.7 22.5 2.4 3.5 20.5 29.4h-8.3L48.2 57z"/></svg>',
  youtube: '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#FF0000"/><path fill="#fff" d="M40 32.5v35l30-17.5L40 32.5z"/></svg>'
};

function sectionKind(title) {
  var t = (title || "").toLowerCase();
  if (t.indexOf("sähkö") === 0 || t.indexOf("sahko") === 0 || t.indexOf("mail") === 0) return "mail";
  if (t.indexOf("kalenteri") === 0 || t.indexOf("calendar") === 0) return "calendar";
  if (t.indexOf("uutiset") === 0 || t === "x") return "x";
  if (t.indexOf("youtube") === 0 || t.indexOf("video") === 0) return "youtube";
  return "mail";
}

function extractHref(el) {
  var a = el.querySelector && el.querySelector("a[href]");
  if (a) return a.getAttribute("href");
  var text = el.textContent || "";
  var m = text.match(/https?:\/\/\S+/);
  return m ? m[0] : null;
}

function buildItemRows(container) {
  var list = document.createElement("div");
  list.className = "item-list";
  var items = [];
  container.querySelectorAll("li").forEach(function (li) { items.push(li); });
  if (!items.length) {
    Array.from(container.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && (n.tagName === "P" || n.tagName === "DIV")) {
        var href = extractHref(n);
        var row = document.createElement(href ? "a" : "div");
        row.className = "item-row";
        if (href) { row.href = href; row.target = "_blank"; row.rel = "noopener noreferrer"; }
        var c = n.cloneNode(true);
        c.querySelectorAll("a[href]").forEach(function (a) {
          var label = (a.textContent || "").trim();
          var h = a.getAttribute("href") || "";
          if (/^https?:\/\//i.test(label) || label === h) a.remove();
          else { var s = document.createElement("span"); s.innerHTML = a.innerHTML; a.replaceWith(s); }
        });
        row.innerHTML = c.innerHTML.replace(/^<p>/i, "").replace(/<\/p>$/i, "");
        if ((row.textContent || "").trim()) list.appendChild(row);
      }
    });
    return list;
  }
  items.forEach(function (li) {
    var href = extractHref(li);
    var row = document.createElement(href ? "a" : "div");
    row.className = "item-row";
    if (href) { row.href = href; row.target = "_blank"; row.rel = "noopener noreferrer"; }
    var clone = li.cloneNode(true);
    clone.querySelectorAll("a[href]").forEach(function (a) {
      var label = (a.textContent || "").trim();
      var h = a.getAttribute("href") || "";
      if (/^https?:\/\//i.test(label) || label === h || label === "↗") a.remove();
      else { var s = document.createElement("span"); s.innerHTML = a.innerHTML; a.replaceWith(s); }
    });
    var chunks = [];
    var buf = document.createElement("div");
    function flush() {
      var t = buf.innerHTML.trim();
      if (t) chunks.push(t);
      buf = document.createElement("div");
    }
    Array.from(clone.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && n.tagName === "BR") { flush(); return; }
      if (n.nodeType === 1 && n.tagName === "P") {
        flush();
        var pt = n.innerHTML.trim();
        if (pt && !/^https?:\/\/\S+$/i.test(n.textContent.trim())) chunks.push(pt);
        return;
      }
      buf.appendChild(n.cloneNode(true));
    });
    flush();
    chunks = chunks.filter(function (c) {
      var tmp = document.createElement("div");
      tmp.innerHTML = c;
      return !/^https?:\/\/\S+$/i.test((tmp.textContent || "").trim());
    });
    if (!chunks.length) return;
    var html = chunks[0];
    for (var i = 1; i < chunks.length; i++) html += '<span class="sub">' + chunks[i] + "</span>";
    row.innerHTML = html;
    list.appendChild(row);
  });
  return list;
}

function renderChat(root, markdownHtml) {
  var wrap = document.createElement("div");
  wrap.innerHTML = markdownHtml;
  var nodes = Array.from(wrap.childNodes);
  var frag = document.createDocumentFragment();
  var nav = document.getElementById("nav");
  nav.innerHTML = "";
  var allBtn = document.createElement("button");
  allBtn.type = "button";
  allBtn.className = "nav-item active";
  allBtn.innerHTML = "<span class=\"hash\">#</span> kaikki";
  allBtn.addEventListener("click", function () {
    document.querySelectorAll(".nav-item").forEach(function (b) { b.classList.remove("active"); });
    allBtn.classList.add("active");
    document.getElementById("footChannel").textContent = "# kaikki";
    document.querySelectorAll(".section-block").forEach(function (s) { s.style.display = ""; });
  });
  nav.appendChild(allBtn);
  var i = 0;
  var color = 0;
  while (i < nodes.length) {
    var node = nodes[i];
    if (node.nodeType === 1 && node.tagName === "H2") {
      var title = (node.textContent || "").trim().replace(/:$/, "");
      var id = "sec-" + color;
      var kind = sectionKind(title);
      var block = document.createElement("section");
      block.className = "section-block";
      block.id = id;
      var head = document.createElement("div");
      head.className = "section-head";
      var icon = document.createElement("span");
      icon.className = "app-icon";
      icon.innerHTML = ICONS[kind] || ICONS.mail;
      if (kind === "calendar") {
        var d = new Date();
        try {
          d = new Date(new Date().toLocaleString("en-US", { timeZone: "Europe/Helsinki" }));
        } catch (e) {}
        icon.innerHTML = icon.innerHTML.replace(/>5</, ">" + d.getDate() + "<");
      }
      var h2 = document.createElement("h2");
      h2.textContent = title;
      head.appendChild(icon);
      head.appendChild(h2);
      block.appendChild(head);
      var bodyWrap = document.createElement("div");
      i += 1;
      while (i < nodes.length) {
        var n = nodes[i];
        if (n.nodeType === 1 && n.tagName === "H2") break;
        bodyWrap.appendChild(n);
        i += 1;
      }
      block.appendChild(buildItemRows(bodyWrap));
      frag.appendChild(block);
      (function (secId, secTitle) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "nav-item";
        b.innerHTML = "<span class=\"hash\">#</span> " + secTitle;
        b.addEventListener("click", function () {
          document.querySelectorAll(".nav-item").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          document.getElementById("footChannel").textContent = "# " + secTitle;
          document.querySelectorAll(".section-block").forEach(function (s) {
            s.style.display = s.id === secId ? "" : "none";
          });
          var el = document.getElementById(secId);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        nav.appendChild(b);
      })(id, title);
      color += 1;
      continue;
    }
    i += 1;
  }
  root.innerHTML = "";
  root.appendChild(frag);
}

fetch("digest.md", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.text(); })
  .then(function (t) {
    var parsed = parseRunMeta(t);
    var el = document.getElementById("content");
    renderChat(el, marked.parse(parsed.body));
    var footer = buildFinnishFooter(parsed.meta);
    document.getElementById("footMeta").textContent = footer || "valmis";
  })
  .catch(function (e) {
    document.getElementById("err").textContent = "digest.md ei latautunut: " + e.message;
    document.getElementById("footMeta").textContent = "virhe";
  });
</script>
</body>
</html>
