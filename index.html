<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Digest</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.45; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  .meta { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
  a { color: inherit; }
  @media (prefers-color-scheme: dark) { .meta { color: #aaa; } }
  #content h1 { display: none; }
  #content h2 { font-size: 1.15rem; margin-top: 1.5rem; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
  @media (prefers-color-scheme: dark) { #content h2 { border-color: #444; } }
  #content p, #content li { margin: 0.35rem 0; }
  #err { color: #b00020; }
</style>
</head>
<body>
  <h1>Daily Digest</h1>
  <p class="meta">Morning brief · lähde: <code>digest.md</code></p>
  <div id="err"></div>
  <article id="content">Ladataan…</article>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('digest.md', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
      .then(t => { document.getElementById('content').innerHTML = marked.parse(t); })
      .catch(e => { document.getElementById('err').textContent = 'digest.md ei latautunut: ' + e.message; document.getElementById('content').textContent = ''; });
  </script>
</body>
</html>
