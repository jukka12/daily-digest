<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Daily Digest</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem('dd-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html[data-theme="light"] {
    --bg: #f6f3ee;
    --bg-elev: #fffdf9;
    --ink: #1c1917;
    --muted: #78716c;
    --line: #e7e0d5;
    --accent: #0f766e;
    --accent-soft: #ccfbf1;
    --danger: #b91c1c;
    --shadow: 0 1px 2px rgba(28, 25, 23, 0.04), 0 12px 32px rgba(28, 25, 23, 0.06);
    --radius: 18px;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #0c0a09;
    --bg-elev: #1c1917;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --line: #292524;
    --accent: #5eead4;
    --accent-soft: #134e4a;
    --danger: #fca5a5;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 16px 40px rgba(0,0,0,0.35);
    --radius: 18px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 500px at 10% -10%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
      radial-gradient(900px 420px at 100% 0%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 1.05rem;
    line-height: 1.55;
  }
  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    z-index: 20;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    box-shadow: var(--shadow);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .theme-toggle:hover { opacity: 0.85; }
  .theme-toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .theme-toggle svg {
    width: 1.15rem;
    height: 1.15rem;
    display: block;
  }
  html[data-theme="light"] .icon-moon { display: none; }
  html[data-theme="dark"] .icon-sun { display: none; }
  .shell {
    width: min(44rem, calc(100% - 2rem));
    margin: 0 auto;
    padding: 2.5rem 0 4rem;
  }
  header.hero { margin-bottom: 1.75rem; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.28rem 0.7rem;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
    background: currentColor;
  }
  h1 {
    font-family: Fraunces, Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 4vw, 2.65rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0.85rem 0 0.55rem;
  }
  .lede {
    margin: 0;
    color: var(--muted);
    max-width: 36rem;
    font-size: 1.02rem;
  }
  .panel {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: clamp(1.25rem, 3vw, 1.85rem);
  }
  #err:empty { display: none; }
  #err {
    margin-bottom: 1rem;
    padding: 0.85rem 1rem;
    border-radius: 12px;
    background: color-mix(in srgb, var(--danger) 12%, transparent);
    color: var(--danger);
    font-size: 0.95rem;
  }
  #content h1 { display: none; }
  #content > p:first-of-type {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 0;
  }
  #content h2 {
    font-family: Fraunces, Georgia, serif;
    font-size: 1.22rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    margin: 1.85rem 0 0.75rem;
    padding-bottom: 0.45rem;
    border-bottom: 1px solid var(--line);
  }
  #content h2:first-of-type { margin-top: 0.35rem; }
  #content p { margin: 0.45rem 0; }
  #content ol {
    margin: 0.4rem 0 0.9rem;
    padding-left: 1.2rem;
  }
  #content li {
    margin: 0.55rem 0;
    padding-left: 0.2rem;
  }
  #content li::marker {
    color: var(--accent);
    font-weight: 600;
  }
  #content strong { font-weight: 600; }
  a,
  #content a {
    color: var(--accent);
    text-decoration: none;
  }
  a:hover,
  #content a:hover { opacity: 0.75; }
  a.link-mark,
  #content a.link-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.35rem;
    height: 1.35rem;
    margin-left: 0.2rem;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    font-size: 0.78rem;
    line-height: 1;
    vertical-align: -0.1em;
  }
  #content code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    padding: 0.1em 0.35em;
    border-radius: 6px;
    background: color-mix(in srgb, var(--line) 70%, transparent);
  }
  footer.note {
    margin-top: 1.25rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer.note a { color: var(--muted); }
</style>
</head>
<body>
  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Vaihda tumma tai vaalea teema" title="Tumma / vaalea">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"></path>
    </svg>
  </button>
  <div class="shell">
    <header class="hero">
      <span class="eyebrow">Morning brief</span>
      <h1>Daily Digest</h1>
      <p class="lede">Posti, kalenteri, X, YouTube ja seurattavat sivut — yksi tiivis aamuraportti.</p>
    </header>
    <div id="err"></div>
    <main class="panel">
      <article id="content">Ladataan…</article>
    </main>
    <footer class="note">Lähde: <code>digest.md</code> · repo <a class="link-mark" href="https://github.com/jukka12/daily-digest" title="jukka12/daily-digest" aria-label="jukka12/daily-digest">↗</a></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      function current() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      }
      function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('dd-theme', theme); } catch (e) {}
        btn.setAttribute('aria-label', theme === 'dark' ? 'Vaihda vaaleaan teemaan' : 'Vaihda tummaan teemaan');
      }
      btn.addEventListener('click', function () {
        setTheme(current() === 'dark' ? 'light' : 'dark');
      });
      setTheme(current());
    })();

    function stylizeLinks(root) {
      root.querySelectorAll('a[href]').forEach(a => {
        const href = a.getAttribute('href') || '';
        const label = (a.textContent || href).trim();
        a.textContent = '↗';
        a.classList.add('link-mark');
        a.title = label;
        a.setAttribute('aria-label', label);
        if (/^https?:/i.test(href)) a.setAttribute('rel', 'noopener noreferrer');
      });
    }
    fetch('digest.md', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
      .then(t => {
        const el = document.getElementById('content');
        el.innerHTML = marked.parse(t);
        stylizeLinks(el);
      })
      .catch(e => {
        document.getElementById('err').textContent = 'digest.md ei latautunut: ' + e.message;
        document.getElementById('content').textContent = '';
      });
  </script>
</body>
</html>
